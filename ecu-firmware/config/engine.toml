# =====================================================================
# Engine configuration - the single source of truth.
#
# Edit THIS file, then run:   python tools/gen_engine_config.py
# which regenerates inc/engine_config.h. Do not edit that header
# directly; it is overwritten.
#
# EVERYTHING IN THE [engine], [crank], [injection] AND [ignition]
# SECTIONS IS A DEFAULT, NOT A MEASUREMENT. The values describe a common
# setup - a 36-1 crank wheel on an 8-cylinder engine with the usual
# small-block firing order - and have been confirmed against no real
# engine, because there isn't one yet.
#
# Get the wheel pattern or firing order wrong and cylinders fire at the
# wrong time, which is how engines get damaged. The generator checks
# that these values are consistent with EACH OTHER; nothing can check
# that they match YOUR engine. Verify every one before running.
# =====================================================================

[engine]
# Number of cylinders. The board has 8 injector and 8 ignition channels;
# a 4- or 6-cylinder engine uses the first N and leaves the rest unwired
# at the harness, which is how one board covers 4/6/8 cylinders.
cylinders = 8

# One full engine cycle in crank degrees. 720 for a four-stroke (two
# crank revolutions per cycle), 360 for a two-stroke - which also makes
# the cam sensor unnecessary, since there is no 360-vs-720 ambiguity to
# resolve.
cycle_degrees = 720

# Firing order, as cylinder numbers in the order they fire. Must be a
# permutation of 1..cylinders - the generator checks this, because a
# typo here (a repeated or missing cylinder) is otherwise very hard to
# spot and produces an engine that runs badly rather than not at all.
#
# Default is the common small-block V8 order. Typical alternatives:
#   4-cylinder inline:  [1, 3, 4, 2]
#   6-cylinder inline:  [1, 5, 3, 6, 2, 4]
# These vary by manufacturer. Check yours.
firing_order = [1, 8, 4, 3, 6, 5, 7, 2]

[crank]
# Trigger wheel pattern. "36-1" means 36 evenly spaced tooth positions
# with one physically removed: 35 real teeth plus a gap that marks a
# known angle. "60-2" is the other common pattern.
#
# teeth sets angular resolution (360/36 = 10 degrees per tooth here).
# missing is what makes absolute position findable at all - the firmware
# finds the gap by spotting a tooth period much longer than the last.
teeth = 36
missing = 1

# Crank angle, in degrees BEFORE cylinder 1's compression TDC, at which
# the first tooth AFTER the gap passes the sensor.
#
# This is the one value that cannot be derived from anything else: it
# depends on where the sensor is physically bolted to the engine. It is
# what converts "which tooth" into "what angle", so an error here shifts
# ALL ignition timing by that amount. Measure it on the real engine -
# the default below is a placeholder, not a typical value to rely on.
gap_to_tdc_deg = 90

[injection]
# How long the injector takes to physically open after the driver turns
# on. Added to every computed pulse width; omit it and the engine runs
# lean by roughly this much at every load point.
#
# This varies strongly with battery voltage, which is exactly why the
# board has a dedicated VBATT sense channel. A single figure here is a
# placeholder for the voltage-compensated table that belongs in its
# place once there is an engine to measure against.
dead_time_us = 1000

[ignition]
# Coil charge time before the spark. Too short gives a weak spark; too
# long overheats the coil. Also really wants a voltage-compensated
# table. The L9779WD-SPI's own over-current protection is a hardware
# backstop, not the primary limit.
dwell_us = 3000

[timebase]
# eMIOS global prescaler divide ratio, applied to the confirmed 60 MHz
# peripheral clock. 60 gives a 1 MHz time base: 1 us per tick, and
# 65.535 ms of range on the eMIOS channels' 16-bit counters - far more
# than the longest event being timed (an injector pulse is single-digit
# milliseconds even at full load).
emios_prescaler = 60

# =====================================================================
# FUELLING
#
# The pulse width comes from speed-density: work out the mass of air in
# the cylinder from pressure, volume and temperature, divide by the
# target air/fuel ratio to get fuel mass, then divide by how fast the
# injector delivers fuel. Volumetric efficiency is the fudge factor that
# makes theory match reality - it is the fraction of the cylinder that
# actually fills, and it is what the [ve] table below holds.
# =====================================================================

# --- Spark advance ---------------------------------------------------
# Crank degrees BEFORE top dead centre to fire the spark. Same bilinear
# interpolation and the same validation as the VE table, on its own
# axes - fuel and spark are independent tables in every real ECU and
# deserve to be tunable on different breakpoints.
#
# WHY THIS EXISTS AT ALL: without it every cylinder fires exactly AT
# TDC, which is what this firmware did before this table. Combustion
# takes real time, so the charge must be lit before TDC for peak
# cylinder pressure to arrive just after it. Firing at TDC makes no
# useful power and pushes the engine toward detonation.
#
# THIS IS A STARTING SHAPE, NOT A TUNED MAP - the same warning the VE
# table carries, and it matters more here. It follows the general
# behaviour of a naturally-aspirated engine: advance rises with RPM
# (less time available per degree) and falls with load (higher cylinder
# pressure burns faster and knocks sooner). It describes no particular
# engine.
#
# OVER-ADVANCE IS HOW ENGINES GET HOLED. Too much advance fires the
# charge while the piston is still rising against it, and the resulting
# detonation destroys pistons and ring lands quickly and quietly. The
# generator enforces a hard band on every cell, and separately checks
# that the largest advance here still fits inside the scheduling window
# - but neither check knows anything about YOUR engine's knock limit.
# That comes from a dyno, a knock ear, or the knock sensors this board
# already has.
[ignition.advance]
rpm_axis = [500, 1000, 1500, 2000, 3000, 4000, 5000, 6000]
map_axis = [20, 40, 60, 80, 100]

# One row per MAP breakpoint, one column per RPM breakpoint.
table = [
  [ 12, 20, 28, 34, 40, 44, 46, 46 ],   #  20 kPa - idle / overrun
  [ 12, 20, 27, 32, 38, 42, 44, 44 ],   #  40 kPa - light cruise
  [ 10, 18, 24, 28, 34, 38, 40, 40 ],   #  60 kPa - cruise
  [ 10, 15, 20, 24, 29, 32, 34, 34 ],   #  80 kPa - part throttle
  [  8, 12, 16, 20, 26, 30, 32, 32 ],   # 100 kPa - wide open throttle
]

[fuel]
# Total engine displacement in cc. Divided by cylinder count to get the
# swept volume of one cylinder.
displacement_cc = 5700

# Injector static flow, cc/min, at the pressure the fuel system actually
# runs. Injectors are usually rated at a reference pressure (commonly
# 3 bar); running a different pressure changes the real flow by roughly
# the square root of the pressure ratio, so use the flow AT YOUR
# PRESSURE, not the number on the box.
injector_cc_per_min = 440

# Fuel density, milligrams per cc. Gasoline is about 745; E85 is nearer
# 780. Used to turn volumetric injector flow into a mass flow.
fuel_density_mg_per_cc = 745

# Target air/fuel ratio, x10 to stay in integer maths (147 = 14.7:1,
# stoichiometric for gasoline). E85 stoich is about 9.8 (98).
#
# A single figure is a simplification: real engines want to run richer
# than stoich at high load for cooling and knock margin. A target-AFR
# table on the same axes as the VE table below is the natural next step,
# and the wideband O2 controllers on this board exist to close the loop
# on it.
target_afr_x10 = 147

[map_sensor]
# MAP sensor transfer function - a linear ratiometric sensor, so kPa is
# a straight line against output voltage.
#
# kpa_at_min / kpa_at_max are the pressures at 0 V and at full scale.
# A common 1-bar sensor reads roughly 10 kPa at 0 V and 105 kPa at 5 V;
# a 2.5-bar boost sensor might be 10 and 250.
kpa_at_min = 10
kpa_at_max = 105

# ADC counts at the sensor's full-scale output. The MCU's ADC is 12-bit
# (0..4095) referenced to 3.3 V.
#
# The sensor is 5 V-ratiometric and the ADC reference is 3.3 V, so the
# board divides 2:1 on this input: 4.7k/4.7k either side of the ADC pin,
# with the existing 22 nF filter cap still at the pin (ecu-pcb,
# build_schematic.py, MAP/TPS front end). 5.00 V maps to 2.500 V, which
# is 3103 counts of 4095, and leaves 0.8 V of headroom under the
# reference.
#
# That divider did not exist until it was found missing while this file
# was being written - the input was a bare 1k + 22nF RC, so everything
# above 3.3 V converted to 0xFFF and this sensor stopped reading at
# ~73 kPa of its 105 kPa range. If you are running a board built before
# that fix, set this to 4095 and accept the clipped top end.
#
# Change this if you change the divider. It is a straight ratio: counts
# = 4095 * (5 V * ratio) / 3.3 V.
adc_counts_at_max = 3103

[ve]
# Volumetric efficiency table, percent. Rows are MAP breakpoints, columns
# are RPM breakpoints; the firmware interpolates between them.
#
# THIS IS A STARTING SHAPE, NOT A TUNED MAP. It follows the general
# behaviour of a naturally-aspirated engine - efficiency poor at low RPM
# and light load, best in the midrange, falling off at high RPM as the
# engine runs out of breath. It describes no particular engine and must
# be replaced by real tuning data before the engine is run in anger.
# Running a wrong VE table lean under load is how pistons get damaged.
rpm_axis = [500, 1000, 1500, 2000, 3000, 4000, 5000, 6000]
map_axis = [20, 40, 60, 80, 100]

# One row per MAP breakpoint, one column per RPM breakpoint.
table = [
  [ 30, 33, 35, 36, 35, 33, 30, 27 ],   #  20 kPa - idle / overrun
  [ 45, 50, 54, 56, 56, 54, 50, 45 ],   #  40 kPa - light cruise
  [ 55, 62, 68, 72, 74, 72, 67, 60 ],   #  60 kPa - cruise
  [ 62, 70, 78, 83, 86, 85, 80, 72 ],   #  80 kPa - part throttle
  [ 66, 75, 84, 90, 94, 93, 88, 80 ],   # 100 kPa - wide open throttle
]

# =====================================================================
# ANALOG SENSORS
# =====================================================================
# Every analog channel is described here rather than in its own C file.
# tools/gen_engine_config.py turns these into a descriptor table that
# src/sensor.c walks with three small conversion kernels, so adding a
# sensor is a config edit, not a new .c/.h pair.
#
# THE DIVIDER IS DESCRIBED, NOT PRE-COMPUTED. Each channel names the
# real resistors in front of it, and the generator works out where full
# scale lands in ADC counts. That number used to be typed in by hand
# (map_sensor.adc_counts_at_max = 3103) and would silently go stale the
# moment the board changed - which is exactly the class of bug that put
# eight 5 V sensors into a 3.3 V ADC with no divider at all. The
# generator now also refuses any divider whose full scale sits above the
# ADC reference, so that specific mistake cannot be described here.
#
# The generator cross-checks these resistor values against
# ../ecu-pcb/build_schematic.py, so config and board cannot drift apart
# silently.
#
# Three kernels:
#   linear     - ratiometric sensor: output swings 0..supply_v and maps
#                linearly onto an engineering range.
#   voltage    - direct voltage measurement through a divider, reported
#                in millivolts. No sensor supply involved.
#   thermistor - NTC element as the bottom half of a divider against a
#                fixed pull-up, then a resistance -> temperature curve.
#
# EGT and knock are deliberately NOT here. EGT is a thermocouple behind
# an SPI ADC needing cold-junction compensation and a NIST polynomial
# (ads1118.h); knock is a raw AC signal wanting a windowed transform,
# not a scalar conversion. Forcing either into this table would make the
# table lie about what it can do.
#
# All temperatures are hundredths of a degree CELSIUS, matching the EGT
# path. The previous CLT/IAT drivers worked in tenths of a degree
# Fahrenheit, which meant a unit conversion in the middle of the fuel
# calculation - one convention removes it.

[adc]
# The ADC reference is VDD_HV_ADC0/1, which this board runs at 3.3 V
# (ecu-pcb, "Power domains"), and ADC_1 is 12-bit.
vref_mv   = 3300
max_counts = 4095

# --- Named curves ----------------------------------------------------
# Shared so a curve measured once can back several channels.

[curve.gm_thermistor]
# REAL PART: DIYAutoTune GM-pattern NTC thermistor element, used by both
# the closed-element CLT sending unit and the open-element IAT sensor.
#
# Rows marked ANCHOR are DIYAutoTune's own published data; every other
# row was derived from those by per-segment Beta interpolation (the
# derivation lived in the old src/clt_sensor.c and is preserved in
# ecu-pcb/build_schematic.py above R24/R25).
#
# REAL DISCREPANCY, RESOLVED RATHER THAN GLOSSED OVER - and it is the
# reason ONE curve backs BOTH sensors. DIYAutoTune's IAT page publishes
# -40F=100700, 87F=2238, 146F=177; the first two are identical to the
# CLT curve, but the third gives a different TEMPERATURE for the same
# 177 ohm reading (146F vs the CLT page's 210.2F). Two genuinely
# different sensors cannot both be right about that. Evidence it is
# copy-paste contamination on the IAT page, not a real second curve:
#   1. That page's own description calls the product a "closed-element
#      sensor" while the product is titled open-element - leftover text
#      from the CLT page.
#   2. Taking 146F at face value implies a per-segment Beta more than
#      twice CLT's own over the shared -40..87F segment (~7900K vs
#      ~3800K), physically implausible for one thermistor, against
#      CLT's internally consistent ~8% segment-to-segment spread.
# Conclusion: the same underlying GM-pattern element in two different
# packages. DIYAutoTune's 146F is not discarded - it is kept as their
# stated MAX RATED temperature for the open-element part, which is a
# real and different fact from a curve point.
#
# Ohms, then temperature in hundredths of a degree C. Resistance must
# descend (temperature ascending); the generator checks it.
points = [
  [ 100700, -4000 ],   # ANCHOR: -40.0 F
  [  47600, -2889 ],
  [  24000, -1778 ],
  [  12800,  -667 ],
  [   7190,   444 ],
  [   4220,  1556 ],
  [   2238,  3000 ],   # ANCHOR: 86.0 F
  [   1590,  3778 ],
  [   1000,  4889 ],
  [    653,  6000 ],
  [    437,  7111 ],
  [    300,  8222 ],
  [    210,  9333 ],
  [    177,  9900 ],   # ANCHOR: 210.2 F
]

# --- Channels --------------------------------------------------------
# `divider` names the real board resistors between the sensor and the
# ADC pin. Omit it for a channel wired straight to the pin.

[sensor.clt]
type        = "thermistor"
curve       = "gm_thermistor"
pullup_ohms = 1000          # R25, to +3V3
refs        = { pullup = "R25" }

[sensor.iat]
type        = "thermistor"
curve       = "gm_thermistor"
pullup_ohms = 4220          # R24, to +3V3
refs        = { pullup = "R24" }

[sensor.map]
# 1-bar MAP. Replace min/max for a boost sensor (a 2.5-bar part is
# typically 10 and 250) - nothing else needs to change.
type      = "linear"
supply_mv = 5000
at_zero   = 10              # kPa at 0 V
at_full   = 105             # kPa at supply
unit      = "kPa"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R22", r_bottom = "R94" }

[sensor.vbatt]
# Direct battery-rail measurement, not a sensor - reports millivolts.
# The divider alone sets the measurable ceiling: 3.3 V x 78k/10k, so
# about 25.7 V. Above that it clamps, which is well past any charging
# voltage and is what the TVS upstream is for.
type    = "voltage"
divider = { r_top = 68000, r_bottom = 10000 }
refs    = { r_top = "R48", r_bottom = "R49" }

# --- Throttle and pedal ----------------------------------------------
# PLACEHOLDER RANGES. A real TPS/APP does not swing the full 0-5 V; it
# typically spans about 0.5-4.5 V, and production practice is to LEARN
# the closed and wide-open endpoints rather than trust a datasheet. The
# 0-100% mapping below is a starting point so these channels report
# something meaningful, not a calibration.
[sensor.tps]
type      = "linear"
supply_mv = 5000
at_zero   = 0
at_full   = 10000           # hundredths of a percent
unit      = "0.01%"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R23", r_bottom = "R95" }

[sensor.tps1]
type      = "linear"
supply_mv = 5000
at_zero   = 0
at_full   = 10000
unit      = "0.01%"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R89", r_bottom = "R100" }

[sensor.tps2]
type      = "linear"
supply_mv = 5000
at_zero   = 0
at_full   = 10000
unit      = "0.01%"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R90", r_bottom = "R101" }

[sensor.app1]
type      = "linear"
supply_mv = 5000
at_zero   = 0
at_full   = 10000
unit      = "0.01%"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R87", r_bottom = "R98" }

[sensor.app2]
type      = "linear"
supply_mv = 5000
at_zero   = 0
at_full   = 10000
unit      = "0.01%"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R88", r_bottom = "R99" }

# --- Pressures -------------------------------------------------------
# PLACEHOLDER RANGES - no specific sender has been chosen for either.
# 0-1000 kPa (about 145 psi) covers common automotive oil and fuel
# pressure senders, but the real part's own transfer function must
# replace this before either reading is trusted for a protection cut.
[sensor.oilp]
type      = "linear"
supply_mv = 5000
at_zero   = 0
at_full   = 1000
unit      = "kPa"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R53", r_bottom = "R96" }

[sensor.fuelp]
type      = "linear"
supply_mv = 5000
at_zero   = 0
at_full   = 1000
unit      = "kPa"
divider   = { r_top = 4700, r_bottom = 4700 }
refs      = { r_top = "R54", r_bottom = "R97" }
